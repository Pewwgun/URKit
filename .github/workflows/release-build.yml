name: Release build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  staged-release:
    name: Staged release (${{ matrix.compiler }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: MSVC
            preset: msvc-release
          - compiler: Clang
            preset: clang-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up MSVC environment
        if: matrix.compiler == 'MSVC'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DURK_BUILD_PUBLIC_RELEASE_STAGE=ON

      - name: Build staged release
        run: cmake --build --preset ${{ matrix.preset }} --parallel --target URKitPublicRelease

      - name: Upload staged release
        uses: actions/upload-artifact@v4
        with:
          name: URKit-${{ matrix.compiler }}
          path: out/build/${{ matrix.preset }}/public-release
          if-no-files-found: error
